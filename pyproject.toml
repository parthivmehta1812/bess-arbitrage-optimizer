[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bess-arbitrage-optimizer"
version = "0.1.0"
description = "MILP-based Battery Energy Storage (BESS) arbitrage optimizer using Pyomo + HiGHS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Parthiv Mehta", email = "parthivmehta2000@gmail.com" }
]
keywords = [
    "battery storage", "BESS", "energy arbitrage",
    "MILP", "Pyomo", "electricity markets", "optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pyomo>=6.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.urls]
Repository = "https://github.com/Parthiv18122000/bess-arbitrage-optimizer"
Issues     = "https://github.com/Parthiv18122000/bess-arbitrage-optimizer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]